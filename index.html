<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Boardgame</title>
    <meta name="description" content="Boardgame - spela brädspel mot en kompis, varsin mobil, i realtid.">
    <meta name="theme-color" content="#0b0c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
    <div id="app">

        <section class="screen" id="screen-profile">
            <div class="card center">
                <h1>Vem spelar?</h1>
                <p class="subtitle">Välj din profil, eller skapa en ny.</p>
                <div id="profile-list" class="profile-list"></div>
                <form id="form-profile-new" class="profile-new-form">
                    <label class="field">
                        <span>Nytt namn</span>
                        <input id="profile-new-name" type="text" maxlength="20" placeholder="Ditt namn" autocomplete="off">
                    </label>
                    <p class="error-text" id="profile-error"></p>
                    <button type="submit" class="btn btn-secondary">Skapa profil</button>
                </form>
            </div>
        </section>

        <section class="screen" id="screen-home">
            <div class="card center">
                <h1>Bordsspel</h1>
                <p class="subtitle">Brädspel mot en kompis — varsin mobil, i realtid.</p>
                <p class="profile-chip">Spelar som <strong id="home-profile-name">–</strong> · <button type="button" id="btn-switch-profile" class="link-btn">byt profil</button></p>
                <div class="button-stack">
                    <button id="btn-show-create" class="btn btn-primary">Skapa rum</button>
                    <button id="btn-show-join" class="btn btn-secondary">Gå med i rum</button>
                    <button id="btn-show-stats" class="btn btn-ghost">Statistik</button>
                </div>
            </div>
        </section>

        <section class="screen" id="screen-create">
            <div class="card">
                <h2>Skapa rum</h2>
                <form id="form-create">
                    <fieldset class="field">
                        <legend>Spel</legend>
                        <div class="radio-row">
                            <label class="radio-chip"><input type="radio" name="gameId" value="tictactoe" checked> Luffarschack</label>
                            <label class="radio-chip"><input type="radio" name="gameId" value="othello"> Othello</label>
                            <label class="radio-chip"><input type="radio" name="gameId" value="backgammon"> Backgammon</label>
                            <label class="radio-chip"><input type="radio" name="gameId" value="battleship"> Sänka skepp</label>
                        </div>
                    </fieldset>
                    <p class="error-text" id="create-error"></p>
                    <div class="button-stack">
                        <button type="submit" class="btn btn-primary">Skapa rum</button>
                        <button type="button" id="btn-create-back" class="btn btn-ghost">Tillbaka</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="screen" id="screen-join">
            <div class="card">
                <h2>Gå med i rum</h2>
                <form id="form-join">
                    <label class="field">
                        <span>Rumskod</span>
                        <input id="join-code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off"
                               autocapitalize="characters" class="code-input" inputmode="text">
                    </label>
                    <p class="error-text" id="join-error"></p>
                    <div class="button-stack">
                        <button type="submit" class="btn btn-primary">Gå med</button>
                        <button type="button" id="btn-join-back" class="btn btn-ghost">Tillbaka</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="screen" id="screen-lobby">
            <div class="card center">
                <h2>Rumskod</h2>
                <div id="lobby-code" class="room-code">----</div>
                <div class="button-row">
                    <button id="btn-copy-link" class="btn btn-secondary">Kopiera länk</button>
                    <button id="btn-share-link" class="btn btn-secondary hidden">Dela</button>
                </div>
                <p id="lobby-status" class="status-text">
                    <span class="spinner" aria-hidden="true"></span>
                    Väntar på motståndare…
                </p>
                <button id="btn-lobby-cancel" class="btn btn-ghost">Avbryt</button>
            </div>
        </section>

        <section class="screen" id="screen-game">
            <div class="game-wrap">
                <div class="topbar">
                    <button id="btn-leave-game" class="icon-btn" aria-label="Lämna spelet">✕</button>
                    <div id="round-indicator" class="round-indicator">Runda 1</div>
                </div>

                <div class="scorebar">
                    <div id="chip-me" class="player-chip">
                        <span id="chip-me-symbol" class="chip-symbol">X</span>
                        <span id="chip-me-name" class="chip-name">Du</span>
                        <span id="chip-me-score" class="chip-score">0</span>
                    </div>
                    <div class="vs">–</div>
                    <div id="chip-opp" class="player-chip">
                        <span id="chip-opp-symbol" class="chip-symbol">O</span>
                        <span id="chip-opp-name" class="chip-name">Motståndare</span>
                        <span id="chip-opp-score" class="chip-score">0</span>
                    </div>
                </div>

                <p id="connection-banner" class="connection-banner hidden"></p>

                <div id="board" class="board"></div>

                <p id="game-status" class="status-text">Din tur</p>
                <button id="btn-play-again" class="btn btn-primary hidden">Spela igen</button>
            </div>
        </section>

        <section class="screen" id="screen-stats">
            <div class="card">
                <div class="topbar">
                    <button id="btn-stats-back" class="icon-btn" aria-label="Tillbaka">✕</button>
                    <h2>Statistik</h2>
                </div>
                <div class="stats-filters">
                    <label class="field">
                        <span>Spel</span>
                        <select id="stats-game"></select>
                    </label>
                    <label class="field">
                        <span>Tidsperiod</span>
                        <select id="stats-timeframe">
                            <option value="today">Idag</option>
                            <option value="week">Senaste veckan</option>
                            <option value="month">Senaste månaden</option>
                            <option value="year">Senaste året</option>
                            <option value="all" selected>Totalt</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Motståndare</span>
                        <select id="stats-opponent">
                            <option value="all" selected>Alla (topplista)</option>
                        </select>
                    </label>
                </div>
                <div id="stats-results" class="stats-results"></div>
            </div>
        </section>

    </div>

    <div id="app-version" class="app-version"></div>

    <script type="module" src="js/main.js?v=18"></script>
</body>
</html>
